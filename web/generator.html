<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-відмітка — генератор карток</title>
<script src="https://unpkg.com/qrcode@1.4.4/build/qrcode.min.js"></script>
<style>
  :root {
    --color-bg: #12161c;
    --color-panel: #1b212b;
    --color-text: #e8ecf1;
    --color-muted: #8a93a3;
    --color-accent: #3b82f6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  #toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 16px;
    background: var(--color-panel);
  }

  #toolbar select {
    padding: 8px 10px;
    font-size: 15px;
    background: #0f1319;
    color: var(--color-text);
    border: 1px solid #2a3140;
    border-radius: 8px;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    padding: 10px 16px;
    background: var(--color-accent);
    color: #fff;
  }

  button:disabled { opacity: 0.5; cursor: default; }

  #status-line {
    color: var(--color-muted);
    font-size: 14px;
  }

  #sheets {
    padding: 16px;
  }

  @page {
    size: A4;
    margin: 1cm;
  }

  /* Навмисно без CSS Grid і без фіксованої висоти аркуша: розмір рядка,
     порахований наперед, у різних браузерах під час друку рахувався
     по-різному й обрізав картку (canvas + підпис не влазили в клітинку
     grid-track). Flexbox з natural-висотою картки застрахований від цього. */
  .sheet-page {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 0.3cm;
    width: 19cm;
    margin: 0 auto 24px;
    background: #fff;
  }

  .card {
    width: 9.3cm;
    border: 1px dashed #999;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.3cm 0.2cm;
  }

  /* QR-код рівно 5 см — це мінімум, за яким камера ще впевнено читає код
     (ROADMAP.md, Етап 4). */
  .card canvas {
    display: block;
    width: 5cm;
    height: 5cm;
  }

  .card-caption {
    margin-top: 0.15cm;
    text-align: center;
    color: #000;
  }

  .card-name {
    font-weight: 700;
    font-size: 13px;
    line-height: 1.2;
  }

  .card-group {
    font-size: 11px;
    color: #555;
  }

  [hidden] { display: none !important; }

  @media print {
    #toolbar { display: none; }
    body { background: #fff; }
    .card {
      break-inside: avoid;
    }
    /* :not(:last-child) — інакше після останнього аркуша друкується зайва порожня сторінка. */
    .sheet-page {
      margin: 0;
    }
    .sheet-page:not(:last-child) {
      page-break-after: always;
    }
  }
</style>
</head>
<body>

<div id="toolbar">
  <select id="group-select">
    <option value="">Завантаження груп…</option>
  </select>
  <select id="student-select" disabled>
    <option value="__all__">— Усі студенти групи —</option>
  </select>
  <button id="generate-button" disabled>Згенерувати картки</button>
  <button id="print-button" hidden>Друкувати</button>
  <span id="status-line"></span>
</div>

<div id="sheets"></div>

<script src="config.local.js"></script>
<script>
'use strict';

const ALL_GROUPS_VALUE = '__all__';
const ALL_STUDENTS_VALUE = '__all__';
const RETRY_ATTEMPTS = 3;
const RETRY_DELAY_MS = 800;
const CARDS_PER_SHEET = 8;

const groupSelect = document.getElementById('group-select');
const studentSelect = document.getElementById('student-select');
const generateButton = document.getElementById('generate-button');
const printButton = document.getElementById('print-button');
const statusLine = document.getElementById('status-line');
const sheetsEl = document.getElementById('sheets');

let allGroups = [];
// Кеш останнього завантаженого списку студентів однієї групи — щоб не тягнути
// його з бекенда двічі (один раз для заповнення <select>, другий — при генерації).
let cachedGroup = null;
let cachedGroupStudents = null;

groupSelect.addEventListener('change', onGroupChanged);
generateButton.addEventListener('click', onGenerateClicked);
printButton.addEventListener('click', function () { window.print(); });

loadGroups();

async function loadGroups() {
  if (typeof APPS_SCRIPT_URL === 'undefined') {
    statusLine.textContent = 'Не знайдено config.local.js з APPS_SCRIPT_URL (див. SETUP.md).';
    return;
  }

  try {
    const response = await callBackendWithRetry({ action: 'groups' });
    if (response.status !== 'ok' || response.groups.length === 0) {
      statusLine.textContent = response.message || 'У "Налаштуваннях" не вказано жодної групи.';
      return;
    }

    allGroups = response.groups;
    groupSelect.innerHTML = '';

    const allOption = document.createElement('option');
    allOption.value = ALL_GROUPS_VALUE;
    allOption.textContent = '— Усі групи —';
    groupSelect.appendChild(allOption);

    allGroups.forEach(function (group) {
      const option = document.createElement('option');
      option.value = group;
      option.textContent = group;
      groupSelect.appendChild(option);
    });

    generateButton.disabled = false;
  } catch (err) {
    statusLine.textContent = 'Немає зв’язку з бекендом: ' + err.message;
  }
}

// При виборі конкретної групи одразу підтягуємо її студентів — і щоб заповнити
// список для вибору одного студента, і про запас для самої генерації.
async function onGroupChanged() {
  const group = groupSelect.value;
  studentSelect.innerHTML = '<option value="' + ALL_STUDENTS_VALUE + '">— Усі студенти групи —</option>';
  studentSelect.disabled = true;
  cachedGroup = null;
  cachedGroupStudents = null;

  if (group === ALL_GROUPS_VALUE) {
    return;
  }

  statusLine.textContent = 'Завантажую список студентів…';
  try {
    const students = await fetchGroupStudents(group);
    students.forEach(function (student) {
      const option = document.createElement('option');
      option.value = String(student.number);
      option.textContent = student.name;
      studentSelect.appendChild(option);
    });
    studentSelect.disabled = false;
    statusLine.textContent = '';
  } catch (err) {
    statusLine.textContent = 'Немає зв’язку з бекендом: ' + err.message;
  }
}

async function fetchGroupStudents(group) {
  if (cachedGroup === group && cachedGroupStudents) {
    return cachedGroupStudents;
  }
  const response = await callBackendWithRetry({ action: 'cards', group: group });
  if (response.status !== 'ok') {
    throw new Error(response.message || 'Не вдалося отримати список групи ' + group);
  }
  cachedGroup = group;
  cachedGroupStudents = response.students;
  return response.students;
}

async function onGenerateClicked() {
  const group = groupSelect.value;
  const studentNumber = studentSelect.value;

  generateButton.disabled = true;
  printButton.hidden = true;
  sheetsEl.innerHTML = '';
  statusLine.textContent = 'Завантажую підписи від бекенда…';

  try {
    let cards;

    if (group === ALL_GROUPS_VALUE) {
      cards = [];
      for (const g of allGroups) {
        const students = await fetchGroupStudents(g);
        students.forEach(function (student) {
          cards.push(Object.assign({ group: g }, student));
        });
      }
    } else {
      const students = await fetchGroupStudents(group);
      if (studentNumber === ALL_STUDENTS_VALUE) {
        cards = students.map(function (student) {
          return Object.assign({ group: group }, student);
        });
      } else {
        const one = students.find(function (student) { return String(student.number) === studentNumber; });
        cards = one ? [Object.assign({ group: group }, one)] : [];
      }
    }

    if (cards.length === 0) {
      statusLine.textContent = 'Немає студентів для вибраних параметрів.';
      return;
    }

    statusLine.textContent = 'Малюю QR-коди…';
    await renderSheets(cards);
    statusLine.textContent = 'Готово: ' + cards.length + ' карток, ' +
      Math.ceil(cards.length / CARDS_PER_SHEET) + ' аркуш(ів) A4.';
    printButton.hidden = false;
  } catch (err) {
    statusLine.textContent = 'Немає зв’язку з бекендом: ' + err.message;
  } finally {
    generateButton.disabled = false;
  }
}

async function renderSheets(cards) {
  for (let i = 0; i < cards.length; i += CARDS_PER_SHEET) {
    const page = document.createElement('div');
    page.className = 'sheet-page';
    sheetsEl.appendChild(page);

    const pageCards = cards.slice(i, i + CARDS_PER_SHEET);
    for (const card of pageCards) {
      page.appendChild(await buildCard(card));
    }
  }
}

async function buildCard(student) {
  const card = document.createElement('div');
  card.className = 'card';

  const canvas = document.createElement('canvas');
  card.appendChild(canvas);
  try {
    // Бібліотека qrcode (soldair/node-qrcode) сама підбирає версію QR-коду
    // під довжину тексту — на відміну від qrcodejs, не падає на кириличних
    // назвах груп ("code length overflow").
    await QRCode.toCanvas(canvas, student.payload, { width: 600, margin: 1, errorCorrectionLevel: 'M' });
  } catch (err) {
    // Не рвемо всю партію через один код — показуємо помилку прямо на картці.
    canvas.remove();
    const errorEl = document.createElement('div');
    errorEl.textContent = 'Помилка QR: ' + err.message;
    errorEl.style.color = '#c00';
    errorEl.style.fontSize = '10px';
    card.appendChild(errorEl);
  }

  const caption = document.createElement('div');
  caption.className = 'card-caption';

  const nameEl = document.createElement('div');
  nameEl.className = 'card-name';
  nameEl.textContent = student.name;
  caption.appendChild(nameEl);

  const groupEl = document.createElement('div');
  groupEl.className = 'card-group';
  groupEl.textContent = student.group;
  caption.appendChild(groupEl);

  card.appendChild(caption);
  return card;
}

// ---------- Звернення до бекенда ----------
// Content-Type: text/plain — щоб fetch лишався "простим" запитом і не викликав
// CORS-preflight, який Apps Script не обробляє (CLAUDE.md, правило 3).

async function callBackend(body) {
  const response = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return response.json();
}

function sleep(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

async function callBackendWithRetry(body) {
  let lastError;
  for (let attempt = 0; attempt < RETRY_ATTEMPTS; attempt++) {
    try {
      return await callBackend(body);
    } catch (err) {
      lastError = err;
      await sleep(RETRY_DELAY_MS);
    }
  }
  throw lastError;
}
</script>
</body>
</html>
