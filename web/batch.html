<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-відмітка — офлайн-сканування</title>
<style>
  :root {
    --color-bg: #12161c;
    --color-panel: #1b212b;
    --color-text: #e8ecf1;
    --color-muted: #8a93a3;
    --color-accent: #3b82f6;
    --color-ok: #1b7a3d;
    --color-duplicate: #b8860b;
    --color-bad: #a12828;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  h1 { font-size: 22px; font-weight: 600; }

  p.hint {
    color: var(--color-muted);
    font-size: 14px;
    line-height: 1.5;
  }

  label {
    display: block;
    margin: 18px 0 6px;
    color: var(--color-muted);
    font-size: 14px;
  }

  input, textarea {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
    background: #0f1319;
    border: 1px solid #2a3140;
    border-radius: 8px;
    color: var(--color-text);
  }

  textarea {
    min-height: 200px;
    resize: vertical;
    line-height: 1.4;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    padding: 12px 18px;
    background: var(--color-accent);
    color: #fff;
    width: 100%;
    margin-top: 20px;
  }

  button:disabled { opacity: 0.5; cursor: default; }

  #form-error {
    margin-top: 12px;
    color: #ff8a8a;
    font-size: 14px;
    min-height: 1.2em;
  }

  #result {
    margin-top: 24px;
    padding: 16px;
    background: var(--color-panel);
    border-radius: 10px;
  }

  #result-summary {
    font-size: 16px;
    margin-bottom: 10px;
  }

  #result-summary span { font-weight: 700; }

  #result-names {
    color: var(--color-text);
    font-size: 14px;
    margin-bottom: 10px;
  }

  #result-problems li {
    font-size: 13px;
    color: var(--color-muted);
    word-break: break-all;
    margin-bottom: 4px;
  }

  #result-problems .status-forged, #result-problems .status-unknown {
    color: #ff8a8a;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<main>
  <h1>Офлайн-сканування</h1>
  <p class="hint">
    Для випадків, коли сканувати доводиться без стабільного зв'язку (напр. «Командою»
    на iPhone, з накопиченням кодів у Нотатках). Встав сюди номер пари і всі
    зіскановані QR-коди (по одному на рядок або через кому) — вони підуть у таблицю
    одним пакетним запитом.
  </p>

  <label for="pair-input">Номер пари</label>
  <input id="pair-input" type="number" min="1" max="8" value="1">

  <label for="codes-input">Зіскановані QR-коди</label>
  <textarea id="codes-input" placeholder="v1|КН-31|07|a7Kd92Lm&#10;v1|КН-31|12|Xz3Qp8Rt&#10;..."></textarea>

  <button id="send-button">Надіслати пакет</button>
  <div id="form-error"></div>

  <div id="result" hidden>
    <div id="result-summary"></div>
    <div id="result-names"></div>
    <ul id="result-problems"></ul>
  </div>
</main>

<script src="config.local.js"></script>
<script>
'use strict';

const RETRY_ATTEMPTS = 3;
const RETRY_DELAY_MS = 800;

const STATUS_LABELS = {
  ok: 'Зараховано',
  duplicate: 'Уже відмічений(а)',
  forged: 'Підроблений код',
  unknown: 'Невідомий код'
};

const pairInput = document.getElementById('pair-input');
const codesInput = document.getElementById('codes-input');
const sendButton = document.getElementById('send-button');
const formError = document.getElementById('form-error');
const resultBox = document.getElementById('result');
const resultSummary = document.getElementById('result-summary');
const resultNames = document.getElementById('result-names');
const resultProblems = document.getElementById('result-problems');

sendButton.addEventListener('click', onSendClicked);

async function onSendClicked() {
  const pair = pairInput.value.trim();
  const codes = codesInput.value.trim();

  formError.textContent = '';
  resultBox.hidden = true;

  if (!pair) {
    formError.textContent = 'Заповни номер пари.';
    return;
  }
  if (!codes) {
    formError.textContent = 'Встав хоча б один зіскановий код.';
    return;
  }
  if (typeof APPS_SCRIPT_URL === 'undefined') {
    formError.textContent = 'Не знайдено config.local.js з APPS_SCRIPT_URL (див. SETUP.md).';
    return;
  }

  sendButton.disabled = true;
  sendButton.textContent = 'Надсилаю…';

  try {
    const response = await callBackendWithRetry({
      action: 'batchCheckin',
      pair: pair,
      payloads: codes
    });

    if (response.status !== 'ok') {
      formError.textContent = response.message || 'Не вдалося обробити пакет.';
      return;
    }

    // Поле не чистимо навіть при успіху — щоб можна було звірити список
    // або повторно надіслати ту саму пачку, якщо треба.
    renderResult(response);
  } catch (err) {
    formError.textContent = 'Немає зв’язку з бекендом: ' + err.message + '. Текст нікуди не зник, спробуй ще раз.';
  } finally {
    sendButton.disabled = false;
    sendButton.textContent = 'Надіслати пакет';
  }
}

function renderResult(response) {
  const summary = response.summary || {};
  resultSummary.innerHTML =
    'Оброблено ' + (response.results || []).length + ': ' +
    'зараховано <span>' + (summary.ok || 0) + '</span>, ' +
    'дублікатів <span>' + (summary.duplicate || 0) + '</span>, ' +
    'підроблених <span>' + (summary.forged || 0) + '</span>, ' +
    'невідомих <span>' + (summary.unknown || 0) + '</span>';

  resultNames.textContent = response.presentNames
    ? 'Зараховано: ' + response.presentNames
    : '';

  resultProblems.innerHTML = '';
  (response.results || []).forEach(function (item) {
    if (item.status !== 'forged' && item.status !== 'unknown') {
      return;
    }
    const li = document.createElement('li');
    li.className = 'status-' + item.status;
    li.textContent = (STATUS_LABELS[item.status] || item.status) + ': ' + item.payload;
    resultProblems.appendChild(li);
  });

  resultBox.hidden = false;
}

// ---------- Звернення до бекенда ----------
// Content-Type: text/plain — щоб fetch лишався "простим" запитом і не викликав
// CORS-preflight, який Apps Script не обробляє (CLAUDE.md, правило 3).

async function callBackend(body) {
  const response = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return response.json();
}

function sleep(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

async function callBackendWithRetry(body) {
  let lastError;
  for (let attempt = 0; attempt < RETRY_ATTEMPTS; attempt++) {
    try {
      return await callBackend(body);
    } catch (err) {
      lastError = err;
      await sleep(RETRY_DELAY_MS);
    }
  }
  throw lastError;
}
</script>
</body>
</html>
